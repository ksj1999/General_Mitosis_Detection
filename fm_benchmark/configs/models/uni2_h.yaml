# Frozen UNI2-h (Mahmood lab). Gated: https://huggingface.co/MahmoodLab/UNI2-h. Not in the Virchow2 paper.
display_name: UNI2-h (frozen)
adapter: timm
params:
  model: hf-hub:MahmoodLab/UNI2-h
  timm_kwargs: {img_size: 224, patch_size: 14, depth: 24, num_heads: 24, init_values: 1.0e-5, embed_dim: 1536,
                mlp_ratio: 5.33334, num_classes: 0, no_embed_class: true, mlp_layer: SwiGLUPacked,
                act_layer: SiLU, reg_tokens: 8, dynamic_img_size: true}
  num_prefix_tokens: 9   # CLS + 8 registers
modes: [cls, cls+mean]
batch_size: 128
precision: bf16
notes: ViT-H/14, 681M parameters. CC-BY-NC-ND-4.0.
