# Frozen UNI (Mahmood lab). Gated (institutional email): https://huggingface.co/MahmoodLab/UNI
display_name: UNI (frozen)
adapter: timm
params:
  model: hf-hub:MahmoodLab/UNI
  timm_kwargs: {init_values: 1.0e-5, dynamic_img_size: true}   # init_values is needed to load LayerScale
  num_prefix_tokens: 1
modes: [cls, cls+mean]
batch_size: 256
precision: fp16
paper_name: UNI
notes: ViT-L/16, 303M parameters, 20x. CC-BY-NC-ND-4.0.
